display_information:
  name: Request Bot
  description: Create and approve requests from Slack
features:
  bot_user:
    display_name: Request Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR-HOST.ngrok-free.app/slack/events
    bot_events:
      - message.channels
  interactivity:
    is_enabled: true
    request_url: https://YOUR-HOST.ngrok-free.app/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
