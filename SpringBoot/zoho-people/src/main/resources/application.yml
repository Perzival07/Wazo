spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wazopulse}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update        # use Flyway/Liquibase migrations in production

zoho:
  client-id: ${ZOHO_CLIENT_ID}
  client-secret: ${ZOHO_CLIENT_SECRET}
  redirect-uri: ${ZOHO_REDIRECT_URI:http://localhost:8080/api/integrations/zoho-people/callback}
  token-encryption-key: ${ZOHO_TOKEN_KEY}      # openssl rand -base64 32
  state-signing-key: ${ZOHO_STATE_KEY}         # openssl rand -base64 32
  frontend-settings-url: ${ZOHO_FRONTEND_URL:http://localhost:8080/}
  cookie-secure: ${ZOHO_COOKIE_SECURE:true}
  default-zone: Asia/Kolkata
  max-requests-per-minute: 80
  sync-interval-ms: 900000      # background Zoho -> database refresh (15 min)
  # scopes default to forms, leave, attendance and employee (all operations).
  # Narrow them for a read-only rollout, for example:
  # scopes: [ZOHOPEOPLE.forms.READ, ZOHOPEOPLE.leave.READ]
